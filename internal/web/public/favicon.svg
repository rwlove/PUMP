<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- dark rounded background -->
  <rect width="64" height="64" rx="10" fill="#222"/>
  <!-- plate left outer -->
  <rect x="8" y="13" width="8" height="28" rx="2" fill="#666666"/>
  <!-- plate left inner -->
  <rect x="16" y="18" width="5" height="18" rx="1.5" fill="#888888"/>
  <!-- bar (gentle upward arch) -->
  <path d="M 21,24 Q 32,17 43,24 L 43,30 Q 32,23 21,30 Z" fill="#777777"/>
  <!-- plate right inner -->
  <rect x="43" y="18" width="5" height="18" rx="1.5" fill="#888888"/>
  <!-- plate right outer -->
  <rect x="48" y="13" width="8" height="28" rx="2" fill="#666666"/>
  <!-- PUMP lettering: outer P's raised like the logo -->
  <text x="32" y="56"
        font-family="system-ui, -apple-system, Arial, sans-serif"
        font-weight="900" font-size="15" letter-spacing="2"
        fill="white" text-anchor="middle">
    <tspan dy="-2">P</tspan><tspan dy="2">UM</tspan><tspan dy="-2">P</tspan>
  </text>
</svg>
