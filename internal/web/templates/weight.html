{{ define "weight.html" }}
<script src="/fs/public/js/weight.js"></script>
<script src="/fs/public/js/weight-chart.js"></script>
<link rel="stylesheet" type="text/css" href="/fs/public/css/index.css" />
<body>
    <div class="container-lg mt-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Body Weight Log</span>
                </div>
                <div class="panel-body p-0">
                <table class="table table-borderless table-sm mb-0">
                    <thead>
                        <tr>
                            <th class="ps-3" style="font-size:0.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--bs-secondary-color);">#</th>
                            <th style="font-size:0.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--bs-secondary-color);">Date</th>
                            <th style="font-size:0.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--bs-secondary-color);">Weight</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="weightList">
                    </tbody>
                </table>
                <div class="d-flex gap-2 px-3 pb-3 pt-2">
                    <button onclick='setWeights({{ .ExData.Weight }}, window._chartColor, 1, {{ .Config.PageStep }});'
                        class="btn btn-sm btn-outline-secondary rounded-3 flex-fill">
                        <i class="bi bi-arrow-left"></i> Older
                    </button>
                    <button onclick='setWeights({{ .ExData.Weight }}, window._chartColor, -1, {{ .Config.PageStep }});'
                        class="btn btn-sm btn-outline-secondary rounded-3 flex-fill">
                        Newer <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="panel mb-4">
                <div class="panel-header"><span class="panel-title">Chart</span></div>
                <div class="panel-body">
                    <canvas id="weight-chart" style="max-height:220px;"></canvas>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header"><span class="panel-title">Add Entry</span></div>
                <div class="panel-body">
                    <form action="/weight/" method="post" class="d-flex gap-2 flex-wrap">
                        <input name="date" type="date" class="form-control rounded-3" id="todayDate" style="max-width:180px;">
                        <input name="weight" type="number" step="any" min="0" class="form-control rounded-3" placeholder="Weight (lbs)" style="max-width:160px;">
                        <button type="submit" class="btn btn-primary rounded-3">
                            <i class="bi bi-plus me-1"></i>Add
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>

<script>
    window._chartColor = getComputedStyle(document.documentElement).getPropertyValue('--bs-primary').trim() || '#2780e3';
    setToday();
    setWeights({{ .ExData.Weight }}, window._chartColor, 0, {{ .Config.PageStep }});
</script>

{{ template "footer.html" }}
{{ end }}
