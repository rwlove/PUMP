{{ define "stats.html" }}
<head>
    <script src="/fs/public/js/stats.js"></script>
    <script src="/fs/public/js/weight-chart.js"></script>
    <link rel="stylesheet" type="text/css" href="/fs/public/css/index.css" />
</head>
<body>
    <script>window.exercises = {{ .ExData.Exs | json | safeJS }};</script>

    <!-- ── Stats Tab Bar ─────────────────────────────────────────────────── -->
    <div class="stats-tabs-bar">
      <div class="container-xl d-flex align-items-center justify-content-between gap-2 flex-wrap">
        <ul class="nav page-tabs" id="statsTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="page-tab-btn active" data-bs-toggle="tab" data-bs-target="#tab-overview" type="button" role="tab">
              <i class="bi bi-grid-1x2 me-2"></i>Overview
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="page-tab-btn" id="tab-activity-btn" data-bs-toggle="tab" data-bs-target="#tab-activity" type="button" role="tab">
              <i class="bi bi-graph-up-arrow me-2"></i>Weight Moved
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="page-tab-btn" id="tab-weight-btn" data-bs-toggle="tab" data-bs-target="#tab-weight" type="button" role="tab">
              <i class="bi bi-speedometer2 me-2"></i>Body Weight
            </button>
          </li>
        </ul>
        <div class="btn-group btn-group-sm py-1 pe-1" id="global-period-btns" role="group" aria-label="Time period">
          <button type="button" class="btn btn-sm btn-outline-secondary active"
            data-period="weekly" onclick="setGlobalPeriod('weekly')">Week</button>
          <button type="button" class="btn btn-sm btn-outline-secondary"
            data-period="monthly" onclick="setGlobalPeriod('monthly')">Month</button>
          <button type="button" class="btn btn-sm btn-outline-secondary"
            data-period="annual" onclick="setGlobalPeriod('annual')">Year</button>
        </div>
      </div>
    </div>

    <div class="tab-content">

      <!-- ── Overview ──────────────────────────────────────────────────────── -->
      <div class="tab-pane fade show active" id="tab-overview" role="tabpanel">
        <div class="container-xl py-4">
          <div class="row g-4">

            <div class="col-12 col-lg-4">
              <div class="panel">
                <div class="panel-header">
                  <span class="panel-title">Summary</span>
                  <small id="period-range" class="text-body-secondary" style="font-size:0.75em;"></small>
                </div>
                <div class="panel-body">
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="p-3 rounded-3 bg-body-secondary text-center">
                        <div class="stat-label">Total Sets</div>
                        <div id="total-sets" class="fw-bold fs-4">-</div>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="p-3 rounded-3 bg-body-secondary text-center">
                        <div class="stat-label">Active Days</div>
                        <div id="active-days" class="fw-bold fs-4">-</div>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="p-3 rounded-3 bg-body-secondary text-center">
                        <div class="stat-label">Most Performed</div>
                        <div id="most-common" class="fw-bold" style="font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">-</div>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="p-3 rounded-3 bg-body-secondary text-center">
                        <div class="stat-label">Least Performed</div>
                        <div id="least-common" class="fw-bold" style="font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">-</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-8">
              <div class="panel">
                <div class="panel-header"><span class="panel-title">Exercise Distribution</span></div>
                <div class="panel-body">
                  <canvas id="exercise-distribution" style="max-height:280px;"></canvas>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- ── Weight Moved ──────────────────────────────────────────────────── -->
      <div class="tab-pane fade" id="tab-activity" role="tabpanel">
        <div class="container-xl py-4">
          <div class="row g-4">
            <div class="col-12">
              <div class="panel">
                <div class="panel-header flex-wrap gap-2">
                  <span class="panel-title">Weight Moved Per Day</span>
                  <select class="form-select form-select-sm" id="volume-ex-select" style="max-width:220px;" onchange="refreshVolumeChart()">
                    {{ range $gr := .GroupMap }}
                    <option value="{{ $gr }}">{{ $gr }}</option>
                    {{ end }}
                  </select>
                </div>
                <div class="panel-body">
                  <canvas id="volume-chart" style="max-height:320px;"></canvas>
                  <p class="text-center text-body-secondary mt-3 mb-0" id="volume-no-data" style="display:none;">No data for this exercise in the selected period.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Body Weight ─────────────────────────────────────────────────────── -->
      <div class="tab-pane fade" id="tab-weight" role="tabpanel">
        <div class="container-xl py-4">
          <div class="row g-4">
            <div class="col-12">
              <div class="panel">
                <div class="panel-header"><span class="panel-title">Body Weight</span></div>
                <div class="panel-body">
                  <canvas id="stats-body-weight" style="max-height:300px;"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

<script>
    window.currentSets  = {{ .ExData.Sets }};
    window._allWeight   = {{ .ExData.Weight }};
    window._chartColor  = getComputedStyle(document.documentElement).getPropertyValue('--bs-primary').trim() || '#2780e3';

    // Init all displays with default period
    setGlobalPeriod('weekly');

    // Lazy-init hidden tabs on first show, respecting current period
    document.getElementById('tab-activity-btn').addEventListener('shown.bs.tab', function() {
        refreshVolumeChart();
    });
    document.getElementById('tab-weight-btn').addEventListener('shown.bs.tab', function() {
        generateWeightChart(filterWeightByPeriod(window._allWeight, currentPeriod), window._chartColor, 0, 'stats-body-weight');
    });
</script>

{{ template "footer.html" }}
{{ end }}
