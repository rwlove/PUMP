{{ define "config.html" }}
<body>
    <div class="container-lg mt-4">
    <div class="row">
        <div class="col-md mb-4">
        <div class="card border-primary">
            <div class="card-header">Config</div>
        <div class="card-body table-responsive">
        <table class="table table-borderless">
            <form action="/config/" method="post">
                <tr>
                    <td>Color mode</td>
                    <td><select name="color" class="form-select">
                        <option value="dark"{{ if eq .Config.Color "dark" }} selected{{ end }}>Dark</option>
                        <option value="light"{{ if eq .Config.Color "light" }} selected{{ end }}>Light</option>
                    </select></td>
                </tr>
                <tr>
                    <td>Page Step<button type="button" class="btn tip-button" mytitle="How many items to show on one page (for Weight and Stats)">
                        <i class="bi bi-question-circle"></i>
                    </button></td>
                    <td><input name="pagestep" type="number" class="form-control" value="{{ .Config.PageStep }}"></td>
                </tr>
                <tr>
                    <td>Exercise sort window (days)<button type="button" class="btn tip-button" mytitle="Exercises are sorted by how often they were used in the last N days. Higher = appears at the top.">
                        <i class="bi bi-question-circle"></i>
                    </button></td>
                    <td><input name="frequencydays" type="number" min="1" class="form-control" value="{{ .Config.FrequencyDays }}"></td>
                </tr>
                <tr>
                    <td>Main page history<button type="button" class="btn tip-button" mytitle="How many days of workouts are available on the main page for review.">
                        <i class="bi bi-question-circle"></i>
                    </button></td>
                    <td><select name="displaydays" class="form-select">
                        <option value="7"{{ if eq .Config.DisplayDays 7 }} selected{{ end }}>Weekly (7 days)</option>
                        <option value="30"{{ if eq .Config.DisplayDays 30 }} selected{{ end }}>Monthly (30 days)</option>
                        <option value="90"{{ if eq .Config.DisplayDays 90 }} selected{{ end }}>Quarterly (90 days)</option>
                        <option value="365"{{ if eq .Config.DisplayDays 365 }} selected{{ end }}>Annually (365 days)</option>
                    </select></td>
                </tr>
                <tr>
                    <td>Auto-fill sets<button type="button" class="btn tip-button" mytitle="When adding an exercise, pre-fill weight and reps from the last time that exercise was performed. Set-position aware: the 2nd set added today pre-fills from the 2nd set last time.">
                        <i class="bi bi-question-circle"></i>
                    </button></td>
                    <td>
                        <div class="form-check form-switch mt-1">
                            <input class="form-check-input" type="checkbox" name="autofill" id="autofillSwitch" role="switch"{{ if .Config.AutoFill }} checked{{ end }}>
                            <label class="form-check-label" for="autofillSwitch">Enabled</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><button type="submit" class="btn btn-primary">Save</button></td>
                    <td></td>
                </tr>
            </form>
        </table>
        </div>
        </div>
        </div>
        <div class="col-md">
            <div class="card border-primary mb-4">
                <div class="card-header">About (<a href="https://github.com/rwlove/PUMP/releases/tag/{{ .Version }}" target="_blank">{{ .Version }}</a>)</div>
            <div class="card-body">
                <p>PUMP — Please Use More Protein — open source workout tracker</p>
            </div>
        </div>
    </div>
    </div>

{{ template "footer.html" }}
{{ end }}
