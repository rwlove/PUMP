---
name: Claude Code

# Responds when someone writes "@claude" in an issue, a PR comment, a PR
# review, or a new issue. Pull-based only: it never runs on push and never
# auto-merges. Any branch or PR it opens waits for Rob to review and merge,
# exactly like any other PR.
"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
      contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
      contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
      (contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Run Claude Code
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
