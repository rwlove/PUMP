---
name: Publish pump-voltra Container Image

# Triggers on git tags of the form `pump-voltra-vA.B.C`. The `pump-voltra-`
# prefix is stripped before tagging the image, so GHCR sees
# `pump-voltra:v0.1.0`. This is the third independent tag line alongside
# `pump-v*` and `pump-cv-v*`; the release cadences do not interact.
#
# Deliberately simpler than cv-publish.yml: there is no CUDA base image and
# no multi-gigabyte layer, so the retag-vs-rebuild search, the QEMU setup and
# the disk-freeing step that workflow needs all buy nothing here.

"on":
  push:
    tags: ["pump-voltra-v[0-9]*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/${{ github.repository_owner }}/pump-voltra

jobs:
  build:
    name: Build and push pump-voltra
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 as well as amd64: the sidecar is small and may be scheduled on
      # the arm64 Spark node alongside pump-cv.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=pump-voltra sidecar
              (VOLTRA I set, rep and resistance auto-logging over BLE)
          tags: |
            type=match,pattern=pump-voltra-(v.*),group=1
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./voltra
          file: ./voltra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
