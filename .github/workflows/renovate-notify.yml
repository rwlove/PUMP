name: Notify Renovate

# Fires after the container publish workflow completes successfully.
# Running in its own workflow means a webhook failure never affects
# the image build or publish result.
on:
  workflow_run:
    workflows:
      - "Publish Container Images"
    types: [completed]

jobs:
  notify:
    name: Trigger Renovate webhook
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository

    runs-on: ubuntu-latest

    env:
      RENOVATE_WEBHOOK_URL: ${{ secrets.RENOVATE_WEBHOOK_URL }}
      # Same secret as GITHUB_WEBHOOK_SECRET in the webhook operator's
      # ExternalSecret (1Password: github → renovate_app_webhook_secret).
      GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}

    steps:
      - name: Skip if secrets not configured
        run: |
          if [ -z "$RENOVATE_WEBHOOK_URL" ] || [ -z "$GITHUB_WEBHOOK_SECRET" ]; then
            echo "RENOVATE_WEBHOOK_URL or GITHUB_WEBHOOK_SECRET not set — skipping."
            exit 0
          fi

      - name: Notify Renovate
        run: |
          # Build the payload that the github-rwlove-pump-package hook expects:
          #   - repository.owner.login = rwlove   (owner check)
          #   - repository.name        = pump     (repo check)
          #   - action                 = published (event check)
          # X-GitHub-Event: release and a valid HMAC-SHA1 X-Hub-Signature
          # are also required by the trigger-rule.
          PAYLOAD='{"action":"published","repository":{"name":"pump","owner":{"login":"rwlove"}}}'

          # Compute HMAC-SHA1 signature of the exact payload bytes
          SIGNATURE="sha1=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha1 -hmac "$GITHUB_WEBHOOK_SECRET" \
            | awk '{print $2}')"

          echo "Sending release/published event to Renovate webhook…"
          curl --silent --show-error --fail \
            --max-time 10 \
            --retry 3 --retry-delay 2 \
            -X POST "$RENOVATE_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-Hub-Signature: $SIGNATURE" \
            -d "$PAYLOAD"
          echo "Renovate webhook notified."
