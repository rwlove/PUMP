---
name: cv tests

# Runs the pump-cv pytest suite on every push or PR that touches cv/.
# Skips the heavy ML deps (torch, ultralytics) — the unit tests use a
# synthetic mock pose source and never load a real model. Keeps the
# job under a minute even on a cold cache.

"on":
  push:
    branches: [main]
    paths:
      - "cv/**"
      - ".github/workflows/cv-test.yml"
  pull_request:
    paths:
      - "cv/**"
      - ".github/workflows/cv-test.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    # Read-only: this job checks out, installs, lints and tests. It never
    # writes to the repo, publishes packages, or posts checks.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the runtime. The image is built on
          # nvcr.io/nvidia/pytorch:25.04-py3, which ships Python 3.12 — testing
          # on 3.10 meant CI never exercised the interpreter production runs.
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        working-directory: cv
        # The [test] extra in pyproject.toml is the single list of what the
        # unit + integration tests need, without ultralytics + torch (~3 min
        # and ~3 GB of wheels the tests never load). Installing the extra
        # directly would drag in the heavy main dependencies, so install the
        # package dep-free and then just the extra's own list. New
        # lightweight test deps go in pyproject.toml, not here.
        run: |
          python -m pip install --upgrade pip tomli
          pip install --no-deps -e .
          python - <<'PY' > /tmp/test-reqs.txt
          import tomli
          with open("pyproject.toml", "rb") as fh:
              cfg = tomli.load(fh)
          print("\n".join(cfg["project"]["optional-dependencies"]["test"]))
          PY
          pip install -r /tmp/test-reqs.txt

      - name: Lint pump_cv
        working-directory: cv
        run: ruff check pump_cv tests

      - name: Run tests
        working-directory: cv
        # The live integration test (test_pump_client_live.py) auto-
        # skips when nothing answers on localhost:8851, so it doesn't
        # need a running PUMP in CI.
        run: pytest -q
