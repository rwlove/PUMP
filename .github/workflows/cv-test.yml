name: cv tests

# Runs the pump-cv pytest suite on every push or PR that touches cv/.
# Skips the heavy ML deps (torch, ultralytics) — the unit tests use a
# synthetic mock pose source and never load a real model. Keeps the
# job under a minute even on a cold cache.

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - ".github/workflows/cv-test.yml"
  pull_request:
    paths:
      - "cv/**"
      - ".github/workflows/cv-test.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test deps
        working-directory: cv
        # Install only what the unit + integration tests need. Skipping
        # ultralytics + torch saves ~3 min and ~3 GB of wheel download.
        run: |
          python -m pip install --upgrade pip
          pip install \
            httpx \
            httpx-sse \
            numpy \
            opencv-python-headless \
            pydantic \
            pyyaml \
            scipy \
            structlog \
            fastapi \
            uvicorn \
            pytest \
            pytest-asyncio

      - name: Lint pump_cv
        working-directory: cv
        run: |
          pip install ruff
          ruff check pump_cv tests

      - name: Run tests
        working-directory: cv
        # The live integration test (test_pump_client_live.py) auto-
        # skips when nothing answers on localhost:8851, so it doesn't
        # need a running PUMP in CI.
        run: pytest -q
