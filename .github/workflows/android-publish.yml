name: Publish Android APK

# Triggers on git tags of the form `pump-vX.Y.Z` (the Android app
# tracks the pump server's release line). The `pump-` prefix is
# stripped to compute VERSION_NAME, APK filename, and the QR code's
# download URL.
on:
  push:
    tags: ["pump-v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      # Strip the `pump-` prefix once, expose as steps.ver.outputs.version
      # for everything below. github.ref_name still has the prefix.
      - name: Compute version (strip pump- prefix)
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#pump-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Bootstrap Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          VERSION_NAME: ${{ steps.ver.outputs.version }}

      - name: Sign APK
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          # Locate the latest installed build-tools (avoids hardcoded version)
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d \
            | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"

          # Decode keystore — strip whitespace first so GNU base64 doesn't
          # reject secrets that were encoded on macOS/Windows (which may
          # contain line breaks or trailing spaces).
          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | tr -d '[:space:]' \
            | base64 -d > /tmp/release.jks

          # Locate the unsigned APK produced by Gradle
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          DIR=$(dirname "$UNSIGNED")
          ALIGNED="$DIR/app-release-aligned.apk"
          SIGNED="$DIR/pump-${{ steps.ver.outputs.version }}.apk"

          # Align then sign
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$SIGNED" \
            "$ALIGNED"

          # Verify and clean up intermediates
          "$BUILD_TOOLS/apksigner" verify "$SIGNED"
          rm -f "$UNSIGNED" "$ALIGNED"
          echo "Signed APK: $SIGNED"

          # Expose path for the upload step
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Upload the signed APK if signing ran, otherwise the unsigned one
          files: |
            ${{ env.SIGNED_APK != '' && env.SIGNED_APK || 'android/app/build/outputs/apk/release/*.apk' }}
          fail_on_unmatched_files: false

      - name: Update QR code on main
        run: |
          # The git tag still has the prefix (release object lives under
          # the full tag name); the APK filename uses the stripped
          # version so existing in-app references still resolve.
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.ver.outputs.version }}"
          APK_URL="https://github.com/rwlove/PUMP/releases/download/${TAG}/pump-${VERSION}.apk"

          # Generate QR code pointing to the now-live APK download
          sudo apt-get install -y --quiet qrencode
          qrencode -o assets/qr-android-install.png \
            -s 8 -m 3 --level=M \
            "$APK_URL"

          # Commit back to main (workflow checked out a tag; switch to main first)
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          # Keep both copies in sync: assets/ (README) and internal/web/public/ (served by the app)
          cp assets/qr-android-install.png internal/web/public/qr-android-install.png
          git add assets/qr-android-install.png internal/web/public/qr-android-install.png
          git commit -m "$(printf 'chore: update QR code for %s APK [skip ci]' "${VERSION}")"
          git push origin main
