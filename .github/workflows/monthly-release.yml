---
name: Monthly release

# On the first of each month, cut the next patch release for EACH pump tag
# line that has source changes since its last tag, then let the existing
# publish -> release -> home-ops chain ship each one. All three lines are
# handled independently and identically:
#
#   line    tag glob             source paths
#   server  pump-v[0-9]*         cmd/ internal/ go.mod go.sum Containerfile
#   cv      pump-cv-v[0-9]*      cv/
#   voltra  pump-voltra-v[0-9]*  voltra/
#
# Each line's source-path set mirrors what its publish workflow uses to decide
# rebuild-vs-retag, so a line with no source changes in a given month cuts
# nothing (no spurious retag). Release notes are scoped to that line's paths.
#
# WHY A DEPLOY KEY, not GITHUB_TOKEN: a tag pushed with the automatic
# GITHUB_TOKEN does NOT trigger other workflows, so the publish workflows
# (which trigger on `push: tags`) would never fire. The checkout authenticates
# with the write deploy key (secret TAG_PUSH_KEY) so each tag push is seen as
# a normal push and fires the chain.
#
# NOTE: this BYPASSES the manual pre-tag ritual in AGENTS.md (screenshot
# regen, README audit, dead-code sweep). Notes are auto-generated from commit
# subjects rather than the hand-written annotated-tag changelog.
#
# cv-base (ghcr pump-cv-base) is NOT a tag line — it auto-builds on push to
# main when cv/Containerfile.base or cv/pyproject.toml change — so it is not
# handled here.

"on":
  schedule:
    # 06:07 UTC on the 1st (~1-2 AM Eastern). Off-peak minute: GitHub delays
    # or drops top-of-hour scheduled runs under load.
    - cron: "7 6 1 * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    # The deploy key does the push; no GITHUB_TOKEN repo write is needed.
    permissions:
      contents: read
    steps:
      - name: Checkout (deploy key)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TAG_PUSH_KEY }}

      - name: Cut monthly releases
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          git config user.name  "pump-release-bot"
          git config user.email "pump-release-bot@users.noreply.github.com"

          TAGS=()

          # cut <name> <tag-glob> <strip-prefix> <path>...
          cut() {
            local name="$1" glob="$2" strip="$3"
            shift 3
            local paths=("$@")
            local last changed ver major rest minor patch newtag notes subj

            last=$(git tag -l "$glob" --sort=-version:refname | head -1)
            if [ -z "$last" ]; then
              echo "[$name] no tag matching ${glob} — skipping."
              return 0
            fi

            changed=$(git rev-list "${last}..HEAD" --count -- "${paths[@]}")
            if [ "$changed" -eq 0 ]; then
              echo "[$name] no source changes since ${last} — nothing."
              return 0
            fi

            ver="${last#"$strip"}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            newtag="${strip}${major}.${minor}.$((patch + 1))"
            if git rev-parse -q --verify "refs/tags/${newtag}" >/dev/null
            then
              echo "::error::[$name] ${newtag} already exists."
              return 1
            fi

            notes=$(git log "${last}..HEAD" --no-merges \
              --pretty=format:'- %s (%h)' -- "${paths[@]}")
            subj="Automated monthly release ${newtag}"
            git tag -a "${newtag}" -m "${subj}" -m "${notes}"
            TAGS+=("$newtag")
            echo "[$name] tagged ${newtag} (+${changed} since ${last})"
          }

          cut server "pump-v[0-9]*" "pump-v" \
            cmd/ internal/ go.mod go.sum Containerfile
          cut cv "pump-cv-v[0-9]*" "pump-cv-v" cv/
          cut voltra "pump-voltra-v[0-9]*" "pump-voltra-v" voltra/

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No line had source changes — nothing released this month."
            exit 0
          fi

          # Push each tag; each push fires its publish workflow, which fires
          # release.yml (the GitHub Release), which fires the home-ops webhook
          # that opens the HelmRelease digest-bump PR.
          for t in "${TAGS[@]}"; do
            echo "Pushing ${t}..."
            git push origin "$t"
          done
          echo "Pushed: ${TAGS[*]}"
