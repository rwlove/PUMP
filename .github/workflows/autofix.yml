name: Auto-fix CI failures

# Triggers whenever one of the listed workflows finishes with a failure.
on:
  workflow_run:
    workflows:
      - "Publish Container Images"
      - "Publish Android APK"
      - "Binary-release"
    types: [completed]

jobs:
  autofix:
    name: Diagnose and fix
    # Only run when the upstream workflow actually failed.
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_commit.author.name != 'github-actions[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the fix commit

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # ── 1. Bail out early if no API key is configured ─────────────────────
      - name: Check CLAUDE_CODE_OAUTH_TOKEN is present
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set — skipping auto-fix."
            exit 0
          fi

      # ── 2. Check out the exact commit that failed ─────────────────────────
      - name: Checkout failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0   # needed so we can push to the branch

      # ── 3. Fetch the failure logs and resolve the failing workflow file ──────
      - name: Fetch failed run logs
        run: |
          echo "Fetching logs for run $FAILED_RUN_ID (branch: $HEAD_BRANCH)"
          gh run view "$FAILED_RUN_ID" --log-failed > /tmp/ci_errors.txt 2>&1 || true
          wc -l /tmp/ci_errors.txt
          # Show a preview so the Actions log is useful for debugging
          head -80 /tmp/ci_errors.txt

      - name: Resolve failing workflow file path
        run: |
          wf_id="${{ github.event.workflow_run.workflow_id }}"
          wf_path=$(gh api "repos/${{ github.repository }}/actions/workflows/${wf_id}" --jq '.path')
          echo "Failing workflow file: ${wf_path}"
          echo "FAILED_WORKFLOW_PATH=${wf_path}" >> "$GITHUB_ENV"

      # ── 4. Set up Python + Anthropic SDK ──────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anthropic SDK
        run: pip install --quiet anthropic

      # ── 5. Ask Claude to fix the errors ───────────────────────────────────
      - name: Run autofix
        id: autofix
        run: python .github/scripts/autofix.py

      # ── 6. Commit and push the fix, then re-trigger the build ───────────────
      - name: Commit, push fix, and re-trigger build
        if: steps.autofix.outputs.fixed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -F /tmp/fix_commit_msg.txt
          FIX_SHA=$(git rev-parse HEAD)

          # Detect whether the failing run was triggered by a version tag
          # (github.event.workflow_run.head_branch is the tag name for tag pushes,
          # e.g. "v0.0.19", or the branch name for branch pushes).
          if [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9] ]]; then
            TAG="$HEAD_BRANCH"
            echo "Tag-triggered build detected (tag: $TAG). Pushing fix to main and re-tagging."

            # Push the fix commit to main so the history is clean
            git push origin "HEAD:refs/heads/main"

            # Move the tag to the fix commit — this re-triggers the build workflows
            git push origin ":refs/tags/${TAG}"   # delete remote tag
            git tag -f "$TAG" "$FIX_SHA"          # recreate locally on fix commit
            git push origin "$TAG"                # push new tag → re-triggers workflows

            echo "Re-tagged ${TAG} → ${FIX_SHA}. Build workflows will re-run."
          else
            # Branch-triggered: pushing the fix commit re-triggers the workflow directly
            git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
            echo "Fix pushed to branch ${HEAD_BRANCH}. Workflow will re-run on new commit."
          fi

      # ── 7. Report outcome ────────────────────────────────────────────────
      - name: Report — no fix found
        if: steps.autofix.outputs.fixed != 'true'
        run: echo "Auto-fix could not determine a fix for this failure. Manual intervention required."
