name: Auto-fix CI failures and warnings

# Triggers whenever one of the listed workflows finishes.
on:
  workflow_run:
    workflows:
      - "Publish Container Images"
      - "Publish Android APK"
      - "Binary-release"
    types: [completed]

jobs:
  autofix:
    name: Diagnose and fix
    # Run on failures AND successes — successful builds may still contain
    # warnings worth cleaning up. The consecutive-attempt check below
    # prevents infinite loops regardless of conclusion.
    if: |
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success') &&
      github.event.workflow_run.repository.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

    steps:
      # ── 1. Early-exit checks ──────────────────────────────────────────────
      - name: Check CLAUDE_CODE_OAUTH_TOKEN is present
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not set — skipping auto-fix."
            exit 0
          fi

      - name: Check consecutive autofix attempt count
        run: |
          # Allow at most 1 consecutive autofix commit at HEAD before stopping.
          # This lets Claude make a second attempt when a first fix was wrong,
          # while still preventing infinite loops.
          STREAK=$(git log --format='%an' -3 "${{ env.HEAD_SHA }}" \
            | grep -c '^github-actions\[bot\]$' || true)
          echo "Consecutive autofix commits at HEAD: $STREAK"
          if [ "$STREAK" -ge 2 ]; then
            echo "::warning::Two consecutive autofix attempts have already failed." \
                 " Manual intervention required."
            exit 0
          fi

      # ── 2. Check out the exact commit ─────────────────────────────────────
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      # ── 3. Fetch logs and resolve the failing workflow file ───────────────
      - name: Fetch run logs
        run: |
          echo "Build conclusion: $BUILD_CONCLUSION"
          echo "Fetching logs for run $FAILED_RUN_ID (branch: $HEAD_BRANCH)"

          if [ "$BUILD_CONCLUSION" = "failure" ]; then
            # For failures get the full log so warnings from passing steps
            # are visible alongside the fatal errors.
            gh run view "$FAILED_RUN_ID" --log > /tmp/ci_logs.txt 2>&1 || true
          else
            # For successful builds get the full log to scan for warnings.
            gh run view "$FAILED_RUN_ID" --log > /tmp/ci_logs.txt 2>&1 || true
          fi

          wc -l /tmp/ci_logs.txt
          head -80 /tmp/ci_logs.txt

      - name: Resolve failing workflow file path
        run: |
          wf_id="${{ github.event.workflow_run.workflow_id }}"
          wf_path=$(gh api "repos/${{ github.repository }}/actions/workflows/${wf_id}" --jq '.path')
          echo "Workflow file: ${wf_path}"
          echo "FAILED_WORKFLOW_PATH=${wf_path}" >> "$GITHUB_ENV"

      # ── 4. Set up Python + Anthropic SDK ──────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anthropic SDK
        run: pip install --quiet anthropic

      # ── 5. Ask Claude to fix errors and/or warnings ───────────────────────
      - name: Run autofix
        id: autofix
        run: python .github/scripts/autofix.py
        env:
          CI_LOG_FILE: /tmp/ci_logs.txt

      # ── 6. Commit and push the fix, then re-trigger the build ─────────────
      - name: Commit, push fix, and re-trigger build
        if: steps.autofix.outputs.fixed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -F /tmp/fix_commit_msg.txt
          FIX_SHA=$(git rev-parse HEAD)

          if [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9] ]]; then
            TAG="$HEAD_BRANCH"
            echo "Tag-triggered build (tag: $TAG). Pushing fix to main and re-tagging."

            git push origin "HEAD:refs/heads/main"
            git push origin ":refs/tags/${TAG}"
            git tag -f "$TAG" "$FIX_SHA"
            git push origin "$TAG"

            echo "Re-tagged ${TAG} → ${FIX_SHA}. Build workflows will re-run."
          else
            git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
            echo "Fix pushed to branch ${HEAD_BRANCH}. Workflow will re-run on new commit."
          fi

      # ── 7. Report outcome ─────────────────────────────────────────────────
      - name: Report — nothing to fix
        if: steps.autofix.outputs.fixed != 'true'
        run: |
          if [ "$BUILD_CONCLUSION" = "success" ]; then
            echo "Build succeeded with no actionable warnings found."
          else
            echo "Auto-fix could not determine a fix. Manual intervention required."
          fi
