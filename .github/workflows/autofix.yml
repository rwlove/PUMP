name: Auto-fix CI failures and warnings

# Triggers whenever one of the listed workflows finishes.
on:
  workflow_run:
    workflows:
      - "Publish Container Images"
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autofix:
    name: Diagnose and fix
    # Only run on failed builds. Scanning every *successful* build for warnings
    # called Claude needlessly against the plan's shared rate limit and turned
    # transient 429s into false-failure emails on healthy releases. The
    # consecutive-attempt check below still prevents infinite fix loops.
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.repository.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

    steps:
      # ── 1. Check out the default branch ───────────────────────────────────
      # IMPORTANT: do NOT use ref: head_sha here.  workflow_run runs in a
      # privileged context (secrets + contents:write).  Checking out an
      # arbitrary SHA supplied by the triggering event is flagged as
      # "untrusted-checkout" by CodeQL.  We always run the autofix script
      # from the trusted default branch; HEAD_SHA is only used as a data
      # value (git-log lookback, push target) — never as executable code.
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ── 2. Early-exit checks ──────────────────────────────────────────────
      - name: Check CLAUDE_CODE_OAUTH_TOKEN is present
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not set — skipping auto-fix."
            exit 0
          fi

      - name: Check consecutive autofix attempt count
        run: |
          # Allow at most 1 consecutive autofix commit at HEAD before stopping.
          # This lets Claude make a second attempt when a first fix was wrong,
          # while still preventing infinite loops.
          # Note: checkout must happen before this step so git is available.
          STREAK=$(git log --format='%an' -3 "${{ env.HEAD_SHA }}" \
            | grep -c '^github-actions\[bot\]$' || true)
          echo "Consecutive autofix commits at HEAD: $STREAK"
          if [ "$STREAK" -ge 2 ]; then
            echo "::warning::Two consecutive autofix attempts have already failed." \
                 " Manual intervention required."
            exit 0
          fi

      # ── 3. Fetch logs and resolve the failing workflow file ───────────────
      - name: Fetch run logs
        run: |
          echo "Build conclusion: $BUILD_CONCLUSION"
          echo "Fetching logs for run $FAILED_RUN_ID (branch: $HEAD_BRANCH)"

          if [ "$BUILD_CONCLUSION" = "failure" ]; then
            # For failures get the full log so warnings from passing steps
            # are visible alongside the fatal errors.
            gh run view "$FAILED_RUN_ID" --log > /tmp/ci_logs.txt 2>&1 || true
          else
            # For successful builds get the full log to scan for warnings.
            gh run view "$FAILED_RUN_ID" --log > /tmp/ci_logs.txt 2>&1 || true
          fi

          wc -l /tmp/ci_logs.txt
          head -80 /tmp/ci_logs.txt

      - name: Resolve failing workflow file path
        run: |
          wf_id="${{ github.event.workflow_run.workflow_id }}"
          wf_path=$(gh api "repos/${{ github.repository }}/actions/workflows/${wf_id}" --jq '.path')
          echo "Workflow file: ${wf_path}"
          echo "FAILED_WORKFLOW_PATH=${wf_path}" >> "$GITHUB_ENV"

      # ── 4. Set up Python + Anthropic SDK ──────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install anthropic SDK
        run: pip install --quiet anthropic

      # ── 5. Ask Claude to fix errors and/or warnings ───────────────────────
      - name: Run autofix
        id: autofix
        run: python .github/scripts/autofix.py
        env:
          CI_LOG_FILE: /tmp/ci_logs.txt

      # ── 6. Commit and push the fix, then re-trigger the build ─────────────
      - name: Commit, push fix, and re-trigger build
        if: steps.autofix.outputs.fixed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -F /tmp/fix_commit_msg.txt

          # Release tags are never rewritten automatically.
          #
          # This used to delete the published tag and force-recreate it at the
          # fix commit. By then ghcr.io already holds an image built from the
          # original tag, so pump-vX.Y.Z would stop identifying the source that
          # produced pump:vX.Y.Z — permanently, and silently.
          #
          # The condition it keyed on was stale anyway: ^v[0-9] predates the
          # pump- prefix split, so "pump-v0.0.109" fell through to the else
          # branch and pushed a *branch* named after the tag. Neither outcome
          # is one you want from an unreviewed model edit.
          #
          # A failed release is a human decision: cut the next patch version.
          # The fix is printed here so it can be applied deliberately.
          if [[ "$HEAD_BRANCH" =~ ^pump(-[a-z]+)?-v[0-9] ]]; then
            echo "::warning::Tag build ${HEAD_BRANCH} failed; fix drafted," \
                 "not pushed. Release tags are never rewritten automatically."
            echo "Proposed change:"
            echo "--- commit message ---"
            cat /tmp/fix_commit_msg.txt
            echo "--- diff ---"
            git show --stat --patch HEAD
            exit 0
          fi

          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          echo "Fix pushed to branch ${HEAD_BRANCH}. Workflow will re-run on new commit."

      # ── 7. Report outcome ─────────────────────────────────────────────────
      - name: Report — nothing to fix
        if: steps.autofix.outputs.fixed != 'true'
        run: |
          if [ "$BUILD_CONCLUSION" = "success" ]; then
            echo "Build succeeded with no actionable warnings found."
          else
            echo "Auto-fix could not determine a fix. Manual intervention required."
          fi
