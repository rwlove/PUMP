name: Publish pump-cv-base Container Image

# Builds the heavy-deps base image used by `pump-cv`. The runtime image
# (cv/Dockerfile) is FROM this base; splitting them lets code-only tag
# bumps ship in <1 min instead of ~8 min.
#
# Triggers:
#   - main branch pushes that touch cv/Dockerfile.base, cv/pyproject.toml,
#     or this workflow file (covers both dep changes and Dockerfile tweaks)
#   - manual workflow_dispatch (rebuild on demand without pushing a commit)
#
# Tag scheme:
#   - <git-sha> — immutable, stable for runtime pins
#   - latest    — mutable, points at HEAD's most recent build
#
# The runtime workflow (cv-publish.yml) resolves :latest to its sha256
# digest at build time and passes that as a build-arg, so the runtime
# image's FROM line is reproducible even though :latest is mutable.

on:
  push:
    branches: [main]
    paths:
      - 'cv/Dockerfile.base'
      - 'cv/pyproject.toml'
      - '.github/workflows/cv-base-publish.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pump-cv-base

jobs:
  build:
    name: Build and push pump-cv-base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The nvcr.io/nvidia/pytorch base is ~10 GB per arch; multi-arch
      # buildkit needs both bases + overlay layers + the buildx
      # registry cache concurrently. The default ubuntu-latest disk
      # (72 GB) fills up partway through. jlumbroso/free-disk-space
      # clears tool-cache + apt large packages + dotnet/android etc.,
      # freeing ~50 GB total — enough headroom.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # pin of @main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=pump-cv runtime base — nvcr.io/nvidia/pytorch 25.04 (CUDA 12.9 + torch 2.7) + ultralytics + opencv, multi-arch (amd64 + arm64)
          tags: |
            type=sha,format=short
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./cv
          file: ./cv/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache co-located with the image: faster pull/push
          # than GHA storage for a ~4 GB image, and no 10 GB GHA cap.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
