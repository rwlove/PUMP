name: Publish pump-cv Container Image

# Triggers on git tags of the form `pump-cv-vA.B.C`. The `pump-cv-`
# prefix is stripped before tagging the image (so GHCR sees
# `pump-cv:v0.1.0`, not `pump-cv:pump-cv-v0.1.0`). The pump server has
# its own `pump-v*` tag line; the two release cadences are independent.
on:
  push:
    tags: ["pump-cv-v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/${{ github.repository_owner }}/pump-cv
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/pump-cv-base

jobs:
  build:
    name: Build and push pump-cv
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for git tag comparison

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Decide: rebuild or retag ──────────────────────────────────────────
      # The pump-cv image is heavy (CUDA + PyTorch + Ultralytics, ~4-6 GB).
      # We don't want to rebuild it for tag bumps that only touch the Go
      # service. Walk backward through prior tags; if we find one whose
      # cv/ source matches the current tag's and whose image is in GHCR,
      # just retag (manifest copy) instead of rebuilding.
      - name: Find published image with identical source
        id: check
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          SOURCE_TAG=""
          for TAG in $(git tag --sort=-version:refname | grep '^pump-cv-v' | grep -v "^${CURRENT_TAG}$"); do

            CHANGED=$(git diff --name-only "${TAG}..${CURRENT_TAG}" -- cv/ 2>/dev/null)

            if [ -n "$CHANGED" ]; then
              echo "${TAG}: cv/ source differs — stopping search, rebuild required."
              break
            fi

            TAG_STRIPPED="${TAG#pump-cv-}"
            if docker buildx imagetools inspect "${IMAGE}:${TAG_STRIPPED}" \
                 > /dev/null 2>&1; then
              echo "${TAG}: same source, image exists — will retag."
              SOURCE_TAG="$TAG"
              break
            else
              echo "${TAG}: same source but no image in GHCR — continuing."
            fi
          done

          if [ -z "$SOURCE_TAG" ]; then
            echo "No published image with identical source found — full build required."
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      # ══ Path A: full build ════════════════════════════════════════════════
      # Multi-arch (linux/amd64 + linux/arm64) — pump-cv-base is now on
      # nvcr.io/nvidia/pytorch which publishes both arches, so the GPU
      # sidecar can schedule on the arm64 Spark/GB10 node.
      #
      # Same disk-space caveat as cv-base-publish: the nvcr.io base is
      # ~10 GB per arch and the runtime image stacks on top. Free
      # ~50 GB before the build to avoid OOM-disk.
      - name: Free disk space
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up QEMU
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      # Resolve the pump-cv-base :latest tag to its immutable digest and
      # pass it as a build-arg. Pinning prevents a mid-build base-image
      # swap from producing an inconsistent runtime image, even though
      # :latest is mutable.
      - name: Resolve base image digest
        if: steps.check.outputs.needs_rebuild == 'true'
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect "${BASE_IMAGE}:latest" \
                     --format '{{ json .Manifest }}' \
                     | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          if [ -z "$DIGEST" ]; then
            echo "Failed to resolve ${BASE_IMAGE}:latest — has cv-base-publish ever run?"
            exit 1
          fi
          PINNED="${BASE_IMAGE}@${DIGEST}"
          echo "base image: ${PINNED}"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        if: steps.check.outputs.needs_rebuild == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=pump-cv camera sidecar (YOLOv8 pose, rep + set detection, plate weight)
          tags: |
            type=match,pattern=pump-cv-(v.*),group=1
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./cv
          file: ./cv/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE=${{ steps.base.outputs.pinned }}
          # Registry cache co-located with the image: faster pull/push
          # than GHA storage, and no 10 GB GHA cap.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # ══ Path B: retag existing image (manifest copy only) ═════════════════
      - name: Retag existing image
        if: steps.check.outputs.needs_rebuild == 'false'
        run: |
          SOURCE="${{ steps.check.outputs.source_tag }}"
          SOURCE_STRIPPED="${SOURCE#pump-cv-}"
          NEW_STRIPPED="${GITHUB_REF_NAME#pump-cv-}"
          echo "Source : ${IMAGE}:${SOURCE_STRIPPED}"
          echo "New tags: ${NEW_STRIPPED}, latest"
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${NEW_STRIPPED}" \
            --tag "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${SOURCE_STRIPPED}"
