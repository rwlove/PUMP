name: Publish Container Images

# Triggers on git tags of the form `pump-vX.Y.Z`. The `pump-` prefix is
# stripped before tagging the image (so GHCR sees `pump:v0.0.80`, not
# `pump:pump-v0.0.80`). The CV sidecar has its own `pump-cv-v*` tag
# line so the two release cadences are independent.
on:
  push:
    tags: ["pump-v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/${{ github.repository_owner }}/pump

jobs:
  build:
    name: Build and push pump
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for git tag comparison

      # Login first so we can probe the registry during the source check.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Decide: rebuild or retag ──────────────────────────────────────────
      - name: Find published image with identical source
        id: check
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          # Walk backward through prior pump-v* tags only. Legacy tags
          # without the prefix are ignored (they pre-date the prefix
          # split). The first prefixed tag falls through to a rebuild,
          # and from there the optimisation kicks in.

          SOURCE_TAG=""
          for TAG in $(git tag --sort=-version:refname | grep '^pump-v' | grep -v "^${CURRENT_TAG}$"); do

            CHANGED=$(git diff --name-only "${TAG}..${CURRENT_TAG}" -- \
              cmd/ internal/ go.mod go.sum Dockerfile.pump 2>/dev/null)

            if [ -n "$CHANGED" ]; then
              echo "${TAG}: source differs — stopping search, rebuild required."
              break
            fi

            # Same source — does the image actually exist in the registry?
            # Strip the pump- prefix when looking up the image tag.
            TAG_STRIPPED="${TAG#pump-}"
            if docker buildx imagetools inspect "${IMAGE}:${TAG_STRIPPED}" \
                 > /dev/null 2>&1; then
              echo "${TAG}: same source, image exists — will retag."
              SOURCE_TAG="$TAG"
              break
            else
              echo "${TAG}: same source but no image in GHCR (failed build?) — continuing."
            fi
          done

          if [ -z "$SOURCE_TAG" ]; then
            echo "No published image with identical source found — full build required."
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      # ══ Path A: full multi-arch rebuild ══════════════════════════════════
      - name: Set up QEMU
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        if: steps.check.outputs.needs_rebuild == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=PUMP server (web UI + JSON API)
          tags: |
            type=match,pattern=pump-(v.*),group=1
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pump
          # Single arch — actual deployment is all x86 (K8s nodes, GPU
          # node, kiosk mini-PC). Multi-arch was costing 10-15 min/build
          # for unused arm64/v7 binaries. Build locally with
          # `--platform linux/arm64` if you ever need the cross-arch.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Registry cache co-located with the image is faster than GHA
          # storage and avoids the 10 GB GHA cap. The cache image lives
          # under the same repo, separate :buildcache tag.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # ══ Path B: retag existing image (manifest copy only) ════════════════
      - name: Retag existing image
        if: steps.check.outputs.needs_rebuild == 'false'
        run: |
          SOURCE="${{ steps.check.outputs.source_tag }}"
          SOURCE_STRIPPED="${SOURCE#pump-}"
          NEW_STRIPPED="${GITHUB_REF_NAME#pump-}"
          echo "Source : ${IMAGE}:${SOURCE_STRIPPED}"
          echo "New tags: ${NEW_STRIPPED}, latest"
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${NEW_STRIPPED}" \
            --tag "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${SOURCE_STRIPPED}"

