name: Publish Container Images

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pump

jobs:
  build:
    name: Build and push pump
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for git tag comparison

      # ── Decide whether a rebuild or a retag is needed ────────────────────
      - name: Find source tag or confirm rebuild needed
        id: check
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          # Walk backward through all previous tags to find the most recent
          # one whose container-relevant source is identical to the current
          # tag. That is the image we can retag rather than rebuild.
          #
          # Checking all tags (not just the previous one) handles cases where
          # source was reverted or a tag was skipped.
          echo "Scanning previous tags for identical container source…"
          SOURCE_TAG=""
          for TAG in $(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$"); do
            CHANGED=$(git diff --name-only "${TAG}..${CURRENT_TAG}" -- \
              cmd/ internal/ go.mod go.sum Dockerfile.pump 2>/dev/null)
            if [ -z "$CHANGED" ]; then
              SOURCE_TAG="$TAG"
              echo "Match: ${SOURCE_TAG} has identical container source."
              break
            fi
          done

          if [ -z "$SOURCE_TAG" ]; then
            echo "No prior tag with identical source — full build required."
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      # ══ Path A: full multi-arch rebuild ══════════════════════════════════
      - name: Set up QEMU
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (build path)
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.needs_rebuild == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=PUMP server (web UI + JSON API)
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pump
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=pump
          cache-to: type=gha,mode=max,scope=pump

      # ══ Path B: retag existing image (manifest copy only) ════════════════
      # No QEMU or buildx setup needed — imagetools only makes registry API
      # calls; it does not pull or push any image layers.
      - name: Log in to GHCR (retag path)
        if: steps.check.outputs.needs_rebuild == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag existing image
        if: steps.check.outputs.needs_rebuild == 'false'
        run: |
          SOURCE="${{ steps.check.outputs.source_tag }}"
          echo "Source image : ${IMAGE}:${SOURCE}"
          echo "New tags     : ${{ github.ref_name }}, latest"
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${{ github.ref_name }}" \
            --tag "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${SOURCE}"
