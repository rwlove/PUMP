name: Publish Container Images

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pump

jobs:
  build:
    name: Build and push pump
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for git tag comparison

      # Login first so we can probe the registry during the source check.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Decide: rebuild or retag ──────────────────────────────────────────
      - name: Find published image with identical source
        id: check
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          # Walk backward through all prior tags.
          # For each tag:
          #   - source differs from current → stop, rebuild needed
          #   - source same, image exists in GHCR → retag from here
          #   - source same, no image in GHCR (failed build) → keep looking

          SOURCE_TAG=""
          for TAG in $(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$"); do

            CHANGED=$(git diff --name-only "${TAG}..${CURRENT_TAG}" -- \
              cmd/ internal/ go.mod go.sum Dockerfile.pump 2>/dev/null)

            if [ -n "$CHANGED" ]; then
              echo "${TAG}: source differs — stopping search, rebuild required."
              break
            fi

            # Same source — does the image actually exist in the registry?
            if docker buildx imagetools inspect "${IMAGE}:${TAG}" \
                 > /dev/null 2>&1; then
              echo "${TAG}: same source, image exists — will retag."
              SOURCE_TAG="$TAG"
              break
            else
              echo "${TAG}: same source but no image in GHCR (failed build?) — continuing."
            fi
          done

          if [ -z "$SOURCE_TAG" ]; then
            echo "No published image with identical source found — full build required."
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      # ══ Path A: full multi-arch rebuild ══════════════════════════════════
      - name: Set up QEMU
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        if: steps.check.outputs.needs_rebuild == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=PUMP server (web UI + JSON API)
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.needs_rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pump
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=pump
          cache-to: type=gha,mode=max,scope=pump

      # ══ Path B: retag existing image (manifest copy only) ════════════════
      - name: Retag existing image
        if: steps.check.outputs.needs_rebuild == 'false'
        run: |
          SOURCE="${{ steps.check.outputs.source_tag }}"
          echo "Source : ${IMAGE}:${SOURCE}"
          echo "New tags: ${{ github.ref_name }}, latest"
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${{ github.ref_name }}" \
            --tag "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${SOURCE}"
