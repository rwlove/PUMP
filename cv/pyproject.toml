[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-cv"
version = "0.1.0"
description = "Camera-based exercise auto-detection sidecar for PUMP."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    # FastAPI needs python-multipart to construct any Form()/UploadFile route
    # at app build time. healthd has /api/v1/reference (file upload), so without
    # it FastAPI raises during build_app() and uvicorn never binds — the admin
    # /wall page silently sees connection refused.
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "ultralytics>=8.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# CI test environment: everything the unit + integration tests import,
# WITHOUT ultralytics/torch (~3 GB) — the tests never load a model.
# opencv-python-headless stands in for opencv-python on headless runners.
test = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "uvicorn>=0.30",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
pump-cv = "pump_cv.main:run"

[tool.setuptools.packages.find]
include = ["pump_cv*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",
  # FastAPI's idiomatic dependency-injection markers (File/Form/Query/...)
  # are intentionally function calls in defaults; B008 fires on every one.
  "B008",
]
